name: Bug report
description: Something is broken
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: diagnostic
    attributes:
      label: Diagnostic
      description: If yapyak showed a `YAPnnnn` diagnostic, paste it.
      placeholder: YAP0021
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `t()` call, config, or repository link that shows the problem.
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - React
        - Vue
        - Svelte
        - Astro
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - Astro
        - React Router
        - SvelteKit
        - TanStack Start
  - type: dropdown
    id: translator
    attributes:
      label: Translator
      options:
        - Anthropic
        - OpenAI
        - Gemini
        - Ollama
        - Custom
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Paste the output of `npx -y envinfo --system --binaries --browsers --npmPackages '{yapyak,@yapyak/*,vite}'`. Review it before posting — the paths can include your username.
      render: shell
    validations:
      required: true
