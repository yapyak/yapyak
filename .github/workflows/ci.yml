name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22.22', '24']
        include:
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm -r --parallel typecheck
      - run: pnpm test
      - if: runner.os == 'Linux'
        run: pnpm --filter @yapyak/docs build
      - if: runner.os == 'Linux'
        run: pnpm -r --filter "./examples/*" build
      - if: runner.os == 'Linux' && matrix.node == '24'
        run: pnpm knip

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        mode: [dev, prod]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @yapyak/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:${{ matrix.mode }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.mode }}-test-results
          path: e2e/test-results

  all-green:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci, e2e]
    if: always()
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
