packages:
  - docs
  - docs/compiler
  - e2e
  - e2e/sandbox
  - examples/*
  - packages/*

allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: false
  keytar: false
  sharp: false
  workerd: false

catalogMode: strict

minimumReleaseAge: 10080

savePrefix: ''

trustLockfile: true

updateConfig:
  ignoreDependencies:
    - '@types/vscode'
    - h3
    - typescript

